name: CI master

# The main-branch lanes: everything the pull-request CI proves plus the
# heavier gates that would waste PR minutes — coverage with partitions, the
# recorded-session snapshot corpus, build-artifact consumers, the Windows
# blocking gate, and the macOS packaging dry-run that keeps a packaging
# regression from surfacing on release day.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-master-${{ github.ref }}
  cancel-in-progress: true

env:
  DSH_TELEMETRY_DISABLED: '1'
  DSH_COVERAGE_TEST_TIMEOUT_MS: '60000'

jobs:
  coverage:
    # Advisory on main for now: the fork's first hosted coverage run measured
    # 30 files below the 100% branch bar — mostly the fork's own new packages
    # (plugin discovery, memory, checkpoints, web search, GitHub connector,
    # the V4→V5 migration) and inherited surface left uncovered by the
    # telemetry/account purge. The bar itself stays 100%; closing the gap is
    # the next test workstream, and this job reports it without blocking
    # packaging and releases meanwhile.
    name: coverage (partitions, advisory)
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check:ci:coverage

  artifacts:
    name: build artifacts and consumers
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      # The built-bin smoke boots the production shell tool, whose sandbox
      # needs bubblewrap; the hosted image ships without it.
      - name: Prepare bubblewrap for the command sandbox
        run: bash scripts/prepare-ci-bubblewrap.sh
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check:ci:artifacts

  snapshot:
    name: recorded-session snapshots
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      # The recorded sessions drive the production shell tool, whose sandbox
      # needs bubblewrap; the Web-recorded scenarios drive headless Chromium.
      # The hosted image ships without both.
      - name: Prepare bubblewrap for the command sandbox
        run: bash scripts/prepare-ci-bubblewrap.sh
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium for the Web-recorded scenarios
        run: pnpm --filter @deepseek-ai/dsh-web-frontend exec playwright install --with-deps chromium
      - run: pnpm run check:ci:snapshot

  windows:
    name: windows blocking gates
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      # A failing build or site aborts the sibling gate on the same runner.
      DSH_GATE_FAIL_FAST: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check:ci:windows-blocking

  mac-package:
    name: macOS packaging dry-run
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The packager requires the git-ignored env file. CI builds the unsigned
      # dry-run with auto-update disabled: app id only, no update origins.
      - run: printf 'DSH_DESKTOP_APP_ID=com.deepseek.harness\nDSH_DESKTOP_AUTO_UPDATE_ENV=production\nDSH_DESKTOP_MANDATORY_UPDATE_PROD_ORIGIN=https://updates.helmcode.invalid\n' > apps/desktop/.env.macos
      - run: pnpm run package:desktop:mac:arm64:dir

  summary:
    name: all checks passed
    needs: [coverage, artifacts, snapshot, windows, mac-package]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ] \
            || [ "${{ contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo 'One or more CI master jobs failed.'
            exit 1
          fi
          echo 'All CI master jobs passed.'
