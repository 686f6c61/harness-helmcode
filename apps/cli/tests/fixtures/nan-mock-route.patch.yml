# Test-only route replacement for the built-CLI e2e suite: this overlay
# REPLACES the shipped nan-builders provider profile (patch semantics are
# replacement, not merge) with one aimed at the suite's HTTP mock. The
# endpoint comes from the environment so each test binds its own mock server;
# the models and compat block must mirror the shipped profile for the catalog
# to resolve identically.
- id: llm-pi-ai
  config:
    providers:
      nan-builders:
        displayName: NaN Builders
        api: openai-completions
        baseURL: !!js "process.env.NAN_BUILDERS_BASE_URL ?? 'https://api.nan.builders/v1'"
        apiKeyEnv: NAN_BUILDERS_API_KEY
        compat:
          thinkingFormat: deepseek
          supportsDeveloperRole: true
        models:
          - id: deepseek-v4-flash
            name: DeepSeek V4.1 Flash
            contextWindow: 1048576
            maxTokens: 32768
            input: [text, image]
            reasoningEfforts:
              low: low
              medium: medium
              high: high
          - id: glm5.3-flash
            name: GLM 5.3 Flash
            contextWindow: 1048576
            maxTokens: 32768
            input: [text, image]
            reasoningEfforts:
              low: low
              medium: medium
              high: high
              max: max
          - id: qwen3.6
            name: Qwen 3.6
            contextWindow: 262144
            maxTokens: 65536
            input: [text, image]
            reasoningEfforts:
              off: none
              minimal: minimal
              low: low
              medium: medium
              high: high
              max: max
          - id: qwen3.8-flash
            name: Qwen 3.8 Flash
            contextWindow: 262144
            maxTokens: 32768
            input: [text, image]
            reasoningEfforts:
              off: none
              minimal: minimal
              low: low
              medium: medium
              high: high
              max: max
          # Vision-capable small model (XML tool calling); effort levels
          # none through max.
          - id: gemma4
            name: Gemma 4
            contextWindow: 262144
            maxTokens: 65536
            input: [text, image]
            reasoningEfforts:
              off: none
              minimal: minimal
              low: low
              medium: medium
              high: high
              max: max
          # Omnimodal input (audio included server-side; the wire
          # modalities here declare only text/image), reasoning always on.
          - id: mimo-v2.6-flash
            name: MiMo V2.6 Flash
            contextWindow: 1048576
            maxTokens: 32768
            input: [text, image]
            reasoningEfforts:
              low: low
              medium: medium
              high: high
