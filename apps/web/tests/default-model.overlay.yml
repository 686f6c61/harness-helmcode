# The fixture-less web scaffold registers no adapter, so the shipped
# deepseek-official default would be a route nothing serves — which the
# composer refuses to type into. This scenario declares its own pi-ai
# routes and starts the default on one of them, and drops the built-in
# NaN Builders catalog so the picker only ever shows the routes this
# scenario declared (plus the scaffold's replay provider).
- id: agent-default-model
  config:
    provider: origin-gateway
    model: origin-large
- id: llm-pi-ai
  config:
    providers: {}
